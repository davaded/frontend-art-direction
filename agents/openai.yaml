interface:
  display_name: "Frontend Art Direction"
  short_description: "Turn one-sentence reference requests into implemented, verified frontend UI."
  default_prompt: "Use $frontend-art-direction. For every frontend request, run the full local audit: inspect the project, build the repository graph, resolve design intelligence and internal control dials, resolve a Visual Direction Contract with composition grammar, alignment axis, dominant/counterweight, type ceiling, spacing rhythm, surface budget, and constraint authority, consider the complete reference inventory, produce the reference/build contract, classify resource provenance, run the internal Transitions.dev Review -> Apply -> Polish bridge, and require rendered desktop/mobile/state proof. Apply only distinct, evidenced reference decisions; record composition, material/type, and interaction-cadence fidelity anchors instead of name-dropping a site. Treat user assets as authoritative; otherwise use high-quality attributable or target-specific generated media, never placeholders or low-quality filler. Keep the direction evidence-first when no case is supplied, and do not infer commerce, dashboard, or editorial structure without a signal. Treat centered hero templates, equal-card walls, type-scale collapse, generic copy, and effect stacks as advisory AI-default warnings, not absolute bans. Let a project-owned DESIGN.md, inspected reference, accepted concept, explicit user direction, or evidence-backed model proposal override them when hard invariants and rendered proof are preserved. Use mature local primitives, preserve cleanup/reduced-motion/fallback, run the premium-finish pass, and report Decision, Changed, Proof, and Open."
