interface:
  display_name: "Frontend Art Direction"
  short_description: "Art-direction workflow for premium frontend UI."
  default_prompt: "Use $frontend-art-direction to create or improve this frontend surface with a clear design stance, explicit references, a concrete style anchor, an explicit medium decision, expressive composition, coherent visual language, signature interaction/motion, and visual QA. Use agent judgment plus the user's request and available evidence to decide whether a direction checkpoint is needed; stop only when ambiguity and cost-of-wrong-direction are both high. If presenting options, make them genuinely differentiated and give each an anchor, signature move, avoid list, scene fit, and misuse risk. Avoid bland middle-ground output, mechanical layouts, generic template rhythm, oversized type, lifeless stock treatment, and decorative animation or models without product meaning."
